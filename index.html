<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Fitness Tracker</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #38bdf8; --danger: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; }
    h1 { font-size: 1.5rem; text-align: center; }
    .card { background: var(--card); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; display: grid; gap: 0.5rem; }
    input, button { padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; font-size: 1rem; }
    input { background: #0f172a; color: var(--text); }
    button { background: var(--accent); color: #0f172a; font-weight: 700; border: none; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .workout { background: var(--card); padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .workout small { color: #94a3b8; }
    .delete { background: var(--danger); color: white; padding: 0.4rem 0.6rem; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>My Fitness Tracker</h1>
  <div class="card">
    <input id="exercise" placeholder="Exercise (e.g., Squat)" />
    <input id="sets" type="number" placeholder="Sets" min="1" />
    <input id="reps" type="number" placeholder="Reps" min="1" />
    <input id="weight" type="number" placeholder="Weight (kg)" min="0" step="0.5" />
    <button onclick="addWorkout()">Add Workout</button>
  </div>
  <div id="list"></div>
  <script>
    let workouts = JSON.parse(localStorage.getItem('workouts') || '[]');

    function save() {
      localStorage.setItem('workouts', JSON.stringify(workouts));
      render();
    }

    function addWorkout() {
      const exercise = document.getElementById('exercise').value.trim();
      const sets = document.getElementById('sets').value;
      const reps = document.getElementById('reps').value;
      const weight = document.getElementById('weight').value;
      if (!exercise || !sets || !reps) return alert('Please fill exercise, sets, and reps.');

      workouts.unshift({ id: Date.now(), exercise, sets, reps, weight: weight || 0 });
      document.getElementById('exercise').value = '';
      document.getElementById('sets').value = '';
      document.getElementById('reps').value = '';
      document.getElementById('weight').value = '';
      save();
    }

    function deleteWorkout(id) {
      workouts = workouts.filter(w => w.id !== id);
      save();
    }

    function render() {
      const list = document.getElementById('list');
      if (workouts.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:#94a3b8;">No workouts yet. Add one above.</p>';
        return;
      }
      list.innerHTML = workouts.map(w => `
        <div class="workout">
          <div>
            <strong>${w.exercise}</strong><br>
            <small>${w.sets} sets × ${w.reps} reps @ ${w.weight} kg</small>
          </div>
          <button class="delete" onclick="deleteWorkout(${w.id})">Delete</button>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
